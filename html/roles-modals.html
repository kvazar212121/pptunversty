<div class="roles-modal" id="rolesModal" hidden>
  <div class="roles-modal-backdrop" data-close-roles-modal></div>
  <div class="roles-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="rolesModalTitle">
    <button type="button" class="roles-modal-close" data-close-roles-modal aria-label="Yopish">&times;</button>
    <div class="roles-modal-body">
      <div class="roles-modal-info">
        <span class="roles-modal-label" id="rolesModalLabel"></span>
        <h2 class="roles-modal-title" id="rolesModalTitle"></h2>
        <p class="roles-modal-desc" id="rolesModalDesc"></p>
        <div class="roles-modal-groups" id="rolesModalGroups"></div>
      </div>
      <div class="roles-modal-app demo-role-col" id="rolesModalAppCol">
        <span class="demo-role-badge" id="rolesModalAppBadge"></span>
        <p class="demo-role-sub" id="rolesModalAppSub"></p>
        <div class="demo-phone roles-modal-phone" id="rolesModalPhone" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</div>
